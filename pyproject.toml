[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heatshift-ai"
version = "0.1.0"
description = "Worker and task simulation foundations"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = ["fastapi==0.160.0", "pydantic==2.14.1", "uvicorn==0.54.0"]
test = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
heatshift_ai = ["scenario_configs/*.json"]
